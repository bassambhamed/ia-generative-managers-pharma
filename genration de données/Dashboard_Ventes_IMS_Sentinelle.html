  for (const p of parts) {
    const name = p.name || c.dict[p.code], share = p.v / total, w = share * (W - 2 * (parts.length - 1)), txt = F.pct.format(share);
    const bg = p.s ? `var(--s${p.s})` : "var(--deemph)", fg = p.s ? `var(--on-s${p.s})` : "var(--ink)";
    const dim = sel.size && p.code >= 0 && !sel.has(p.code);
    const blk = el("div", "seg-b"); blk.style.flex = `${Math.max(share, 0.0001)} 1 0`; blk.style.background = bg; blk.style.color = fg; if (dim) blk.style.opacity = ".35";
    const fits = w >= textW(txt); if (fits) blk.textContent = txt;
    blk.tabIndex = 0; blk.setAttribute("aria-label", `${name} : ${fmt(m, p.v, false)} (${txt})`);
    const trs = [{ color: bg, value: fmt(m, p.v, false), label: m.label }, { value: txt, label: "du total" }];
    blk.addEventListener("pointermove", ev => showTip(ev, name, trs)); blk.addEventListener("pointerleave", hideTip); focusTip(blk, name, trs);
    const lg = el("div", "lg"); const sw = el("i"); sw.style.background = bg; lg.append(sw, el("span", "n", name), el("span", "x", fmt(m, p.v, true) + (fits ? "" : " · " + txt))); lg.title = name;
    if (p.code >= 0) { const go = () => toggle(d.column, p.code); blk.addEventListener("click", go); lg.addEventListener("click", go); blk.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } }); }
    stack.appendChild(blk); legend.appendChild(lg);
  }
  host.append(stack, legend);
}

/* ---------- table ---------- */
const PAGE = 25;
function cellText(name, i) {
  const c = COL[name];
  if (c.type === "num") { const v = c.v[i]; const pm = PCTM[name]; if (pm && v === v) return fmt(pm, v, false); return v === v ? (Number.isInteger(v) ? F.int.format(v) : F.dec.format(v)) : ""; }
  if (c.type === "date") { const v = c.v[i]; return v === v ? D.day.format(toDate(v)) : ""; }
  if (c.type === "cat") return c.dict[c.v[i]];
  return c.v[i] == null ? "" : String(c.v[i]);
}
function renderTable(idx) {
  const cols = SPEC.table_columns, thead = $("#tbl thead"), tbody = $("#tbl tbody");
  let rows = idx;
  if (state.q) { const q = state.q.toLowerCase(); rows = rows.filter(i => cols.some(n => COL[n].type !== "num" && cellText(n, i).toLowerCase().includes(q))); }
  if (state.sortCol) {
    const c = COL[state.sortCol], dir = state.sortDir;
    rows = rows.slice().sort((a, b) => {
      let x, y;
      if (c.type === "cat") { x = c.dict[c.v[a]]; y = c.dict[c.v[b]]; return x.localeCompare(y, LOC) * dir; }
      if (c.type === "text") { x = c.v[a] || ""; y = c.v[b] || ""; return String(x).localeCompare(String(y), LOC) * dir; }
      x = c.v[a]; y = c.v[b]; if (x !== x) return 1; if (y !== y) return -1; return (x - y) * dir;
    });
  }
  const pages = Math.max(1, Math.ceil(rows.length / PAGE)); state.page = Math.min(state.page, pages - 1);
  thead.replaceChildren(); const tr = el("tr");
  for (const n of cols) {
    const th = el("th", COL[n].type === "num" ? "n" : "", n + (state.sortCol === n ? (state.sortDir > 0 ? " ▲" : " ▼") : "")); th.tabIndex = 0; th.setAttribute("aria-sort", state.sortCol === n ? (state.sortDir > 0 ? "ascending" : "descending") : "none");
    const go = () => { if (state.sortCol === n) state.sortDir *= -1; else { state.sortCol = n; state.sortDir = COL[n].type === "num" ? -1 : 1; } renderTable(idx); };
    th.addEventListener("click", go); th.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); }); tr.appendChild(th);
  }
  thead.appendChild(tr); tbody.replaceChildren();
  const frag = document.createDocumentFragment();
  for (const i of rows.slice(state.page * PAGE, state.page * PAGE + PAGE)) { const r = el("tr"); for (const n of cols) r.appendChild(el("td", COL[n].type === "num" ? "n" : "", cellText(n, i))); frag.appendChild(r); }
  tbody.appendChild(frag);
  $("#tablesub").textContent = F.int.format(rows.length) + " ligne" + (rows.length > 1 ? "s" : "") + (rows.length !== N ? " sur " + F.int.format(N) : "");
  $("#pginfo").textContent = rows.length ? `Page ${state.page + 1} / ${pages}` : "Aucune ligne";
  $("#prev").disabled = state.page === 0; $("#next").disabled = state.page >= pages - 1;
  $("#csv").onclick = () => {
    const esc = s => /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    const lines = [cols.map(esc).join(";")]; for (const i of rows) lines.push(cols.map(n => esc(COL[n].type === "num" ? String(COL[n].v[i] === COL[n].v[i] ? COL[n].v[i] : "") : cellText(n, i))).join(";"));
    const a = el("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" })); a.download = "donnees_filtrees.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}

/* ---------- main render ---------- */
let raf = 0;
function render() { state.page = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
function draw() {
  hideTip();
  syncSlicers(); renderChips();
  const idx = select(null);
  renderKPIs(idx);
  if (HASDATE) renderTrend(idx);
  renderShare();
  renderRank("rank1", state.r1m, state.r1d);
  if (DIMS.length) renderRank("rank2", state.r2m, state.r2d);
  renderTable(idx);
}

/* ---------- init ---------- */
function init() {
  $("#title").textContent = SPEC.title;
  $("#subtitle").textContent = [SPEC.subtitle, SPEC.source ? "Source : " + SPEC.source : ""].filter(Boolean).join(" · ");
  const mItems = SPEC.measures.map(m => [m.id, m.label]), aItems = ADD.map(m => [m.id, m.label]), dItems = DIMS.map(d => [d.column, d.label]);
  fillSelect($("#trendm"), mItems, state.trendM); $("#trendm").onchange = e => { state.trendM = e.target.value; render(); };
  const gs = $("#grains");
  for (const [g, t] of GRAINS) { const b = el("button", null, t); b.type = "button"; b.dataset.g = g; b.onclick = () => { state.grain = g; for (const x of gs.children) x.setAttribute("aria-pressed", x.dataset.g === g); render(); }; b.setAttribute("aria-pressed", g === state.grain); gs.appendChild(b); }
  if (!HASDATE) $("#trendcard").style.display = "none";
  if (!DIMS.length || !aItems.length) $("#sharecard").style.display = "none";
  else { fillSelect($("#sharem"), aItems, state.shareM); fillSelect($("#shared"), dItems, state.shareD); $("#sharem").onchange = e => { state.shareM = e.target.value; render(); }; $("#shared").onchange = e => { state.shareD = e.target.value; render(); }; }
  if (!DIMS.length) { $("#rank1card").style.display = "none"; $("#rank2card").style.display = "none"; }
  else {
    for (const p of ["rank1", "rank2"]) {
      fillSelect($("#" + p + "m"), mItems, state[p === "rank1" ? "r1m" : "r2m"]); fillSelect($("#" + p + "d"), dItems, state[p === "rank1" ? "r1d" : "r2d"]);
      $("#" + p + "m").onchange = e => { state[p === "rank1" ? "r1m" : "r2m"] = e.target.value; render(); };
      $("#" + p + "d").onchange = e => { state[p === "rank1" ? "r1d" : "r2d"] = e.target.value; render(); };
    }
    if (DIMS.length < 2) { $("#rank2card").style.display = "none"; $("#rank1card").className = "card c12"; }
  }
  // layout when there is no trend: share + ranks fill the row
  if (!HASDATE && DIMS.length) { $("#sharecard").className = "card c12"; }
  $("#reset").onclick = clearAll; $("#print").onclick = () => window.print();
  const root = document.documentElement;
  try { const t = localStorage.getItem("kpi-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("#theme").onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("kpi-theme", root.dataset.theme); } catch (e) {} };
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); state.page = 0; renderTable(select(null)); });
  $("#prev").onclick = () => { state.page--; renderTable(select(null)); }; $("#next").onclick = () => { state.page++; renderTable(select(null)); };
  initDatePanel(); initSlicers();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
  draw();
}
init();
})();
</script>
